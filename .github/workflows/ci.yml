name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # pytest also collects unittest-style tests. Exit code 5 means no
      # tests were collected, which is fine until a test suite lands.
      - name: Run tests
        run: uv run --with pytest python -m pytest -v || [ $? -eq 5 ]

      - name: Smoke run main.py
        run: timeout 60 uv run python main.py
